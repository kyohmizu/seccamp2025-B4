---
# データベースのネットワークポリシー
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-netpol
  namespace: seccamp-app
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # バックエンドからのデータベース接続のみ許可
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 3306
  egress:
  # DNS解決を許可
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# デフォルトでポッド間通信を拒否（デフォルトDeny）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: seccamp-app
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
