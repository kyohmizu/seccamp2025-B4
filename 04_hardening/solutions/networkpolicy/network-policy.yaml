# フロントエンドのネットワークポリシー
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: seccamp-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 外部からのHTTPアクセスを許可
  - from: []
    ports:
    - protocol: TCP
      port: 80
  egress:
  # DNS解決を許可
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # バックエンドAPIへのアクセスを許可
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000

